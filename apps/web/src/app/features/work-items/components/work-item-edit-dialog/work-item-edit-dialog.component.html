<div
  class="modal-backdrop"
  *ngIf="item as current"
  (click)="closed.emit()"
  role="presentation"
>
  <section
    class="edit-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'edit-title-' + current.id"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div>
        <div class="section-kicker">WORK ITEM #{{ current.id }}</div>
        <h2 [id]="'edit-title-' + current.id">Edit work item</h2>
        <p>Changes will be saved to Azure DevOps.</p>
      </div>

      <button
        type="button"
        class="icon-button"
        (click)="closed.emit()"
        aria-label="Close edit dialog"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <form (ngSubmit)="submit()">
      <div class="field-label">
        Work item type
        <div class="readonly-field">{{ current.type }}</div>
      </div>

      <label class="field-label">
        Title
        <input
          type="text"
          name="editTitle"
          [(ngModel)]="editTitle"
          required
          maxlength="255"
        />
      </label>

      <label class="field-label">
        Description
        <textarea
          name="editDescription"
          [(ngModel)]="editDescription"
          rows="4"
          maxlength="20000"
        ></textarea>
      </label>

      <label
        class="field-label"
        *ngIf="current.type === 'User Story' || current.type === 'Bug'"
      >
        Acceptance Criteria
        <textarea
          name="editAcceptanceCriteria"
          [(ngModel)]="editAcceptanceCriteria"
          rows="5"
          placeholder="Given..., When..., Then..."
          maxlength="20000"
        ></textarea>
      </label>

      <div class="form-grid">
        <label class="field-label">
          State
          <select name="editState" [(ngModel)]="editState">
            <option *ngFor="let state of availableStates" [ngValue]="state">
              {{ state }}
            </option>
          </select>
        </label>

        <label class="field-label">
          Assigned to (email)
          <input
            type="email"
            name="editAssignee"
            [(ngModel)]="editAssignee"
            placeholder="user@company.com"
          />
        </label>

        <label class="field-label">
          Priority
          <select name="editPriority" [(ngModel)]="editPriority">
            <option *ngFor="let priority of priorities" [ngValue]="priority">
              {{ priority }}
            </option>
          </select>
        </label>
      </div>

      <p class="form-error" *ngIf="modalError" role="alert">
        {{ modalError }}
      </p>

      <div class="modal-actions">
        <button
          type="button"
          class="button button-quiet"
          (click)="closed.emit()"
        >
          Cancel
        </button>

        <button type="submit" class="button button-primary" [disabled]="saving">
          <i
            class="pi"
            [ngClass]="saving ? 'pi-spinner pi-spin' : 'pi-check'"
          ></i>

          {{ saving ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  </section>
</div>
