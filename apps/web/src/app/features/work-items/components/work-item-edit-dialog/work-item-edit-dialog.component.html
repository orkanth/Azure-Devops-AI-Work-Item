<div
  class="modal-backdrop"
  *ngIf="item as current"
  (click)="closed.emit()"
  role="presentation"
>
  <section
    class="edit-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'edit-title-' + current.id"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div>
        <div class="section-kicker">WORK ITEM #{{ current.id }}</div>
        <h2 [id]="'edit-title-' + current.id">Edit work item</h2>
        <p>Update fields in the local prototype.</p>
      </div>
      <button
        type="button"
        class="icon-button"
        (click)="closed.emit()"
        aria-label="Close edit dialog"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <form (ngSubmit)="submit()">
      <label class="field-label">
        Title
        <input
          type="text"
          name="editTitle"
          [(ngModel)]="editTitle"
          required
          maxlength="180"
        />
      </label>

      <div class="form-grid">
        <label class="field-label">
          Work item type
          <select name="editType" [(ngModel)]="editType">
            <option *ngFor="let type of workItemTypes" [ngValue]="type">{{ type }}</option>
          </select>
        </label>

        <label class="field-label">
          State
          <select name="editState" [(ngModel)]="editState">
            <option *ngFor="let state of workItemStates" [ngValue]="state">{{ state }}</option>
          </select>
        </label>

        <label class="field-label">
          Assigned to
          <input
            type="text"
            name="editAssignee"
            [(ngModel)]="editAssignee"
            placeholder="Person name or Unassigned"
          />
        </label>

        <label class="field-label">
          Priority
          <select name="editPriority" [(ngModel)]="editPriority">
            <option *ngFor="let priority of priorities" [ngValue]="priority">{{ priority }}</option>
          </select>
        </label>
      </div>

      <p class="form-error" *ngIf="modalError" role="alert">{{ modalError }}</p>

      <div class="modal-actions">
        <button type="button" class="button button-quiet" (click)="closed.emit()">
          Cancel
        </button>
        <button type="submit" class="button button-primary">
          <i class="pi pi-check"></i> Save changes
        </button>
      </div>
    </form>
  </section>
</div>
