<section class="command-card" aria-labelledby="command-title">
  <div class="command-header">
    <div class="command-heading">
      <div class="command-icon">
        <i class="pi pi-sparkles" aria-hidden="true"></i>
      </div>

      <div>
        <h2 id="command-title">{{ title }}</h2>
        <p>{{ description }}</p>
      </div>
    </div>

    <span class="beta-pill">{{ badgeLabel }}</span>
  </div>

  <div class="command-input-wrap">
    <textarea
      [ngModel]="promptText"
      (ngModelChange)="promptTextChange.emit($event)"
      (keydown.control.enter)="submit()"
      (keydown.meta.enter)="submit()"
      rows="3"
      aria-label="Describe your request"
      [placeholder]="placeholder"
    ></textarea>

    <div class="command-input-footer">
      <span>
        <i class="pi pi-info-circle" aria-hidden="true"></i>
        Use natural language to describe your request
      </span>

      <button
        type="button"
        class="button button-primary"
        [disabled]="isLoading || !promptText.trim()"
        (click)="submit()"
      >
        @if (isLoading) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          Processing...
        } @else {
          <i class="pi pi-sparkles" aria-hidden="true"></i>
          {{ buttonLabel }}
          <i class="pi pi-arrow-right" aria-hidden="true"></i>
        }
      </button>
    </div>
  </div>

  @if (samplePrompts.length > 0) {
    <div class="prompt-examples">
      <span class="examples-label">TRY A PROMPT</span>

      @for (prompt of samplePrompts; track prompt) {
        <button type="button" (click)="promptTextChange.emit(prompt)">
          <i class="pi pi-arrow-up-left" aria-hidden="true"></i>
          {{ prompt }}
        </button>
      }
    </div>
  }
</section>
