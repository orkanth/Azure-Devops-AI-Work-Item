<header class="topbar">
  <div class="breadcrumb">
    <span>Workspace</span>
    <i class="pi pi-angle-right"></i>
    <strong>{{ title }}</strong>
  </div>

  <div class="topbar-actions"> 

    <div
      class="api-health-indicator"
      [class.api-online]="apiStatus() === 'online'"
      [class.api-offline]="apiStatus() === 'offline'"
      [attr.title]="apiError() || 'NestJS API health status'"
      role="status"
      aria-live="polite"
    >
      <span class="api-health-dot"></span>
      <span>
        {{
          apiStatus() === 'checking'
            ? 'Checking API'
            : apiStatus() === 'online'
              ? 'API online'
              : 'API offline'
        }}
      </span>
      <button
        type="button"
        class="api-retry"
        (click)="checkApiConnection()"
        [disabled]="apiStatus() === 'checking'"
        aria-label="Retry API health check"
        title="Retry API health check"
      >
        <i class="pi pi-refresh"></i>
      </button>
    </div>

    <button
      type="button"
      class="icon-button notification-button"
      title="Notifications"
      aria-label="Notifications"
    >
      <i class="pi pi-bell"></i><b></b>
    </button>
    <div class="avatar avatar-blue">RK</div>
  </div>
</header>
